<svg viewBox="0 0 680 440" width="100%" role="img">
  <title>Playwright Java 请求时序与 API 分层</title>
  <desc>一次成功请求的事件时序、断言层解析点、数据可用区间与三个执行线程</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="110" y="112" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">请求发出</text>
  <text x="310" y="112" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">响应头到达</text>
  <text x="510" y="112" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">body 下载完成</text>

  <circle cx="310" cy="140" r="5" fill="#888780"/>
  <circle cx="510" cy="140" r="5" fill="#888780"/>
  <rect x="55" y="156" width="110" height="26" rx="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="110" y="169" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">onRequest</text>
  <rect x="250" y="156" width="120" height="26" rx="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="310" y="169" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">onResponse</text>
  <rect x="420" y="156" width="180" height="26" rx="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="169" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">onRequestFinished</text>

  <line x1="510" y1="182" x2="510" y2="202" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <text x="310" y="242" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">头已到，body 未齐</text>
  <rect x="410" y="202" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="222" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">waitForRequestFinished 解析</text>

  <text x="125" y="242" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">onRequestFailed → failure()</text>
  <rect x="225" y="274" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="310" y="292" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">响应头阶段可用</text>

  <text x="510" y="310" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">body · sizes · postData</text>
  <rect x="40" y="348" width="193" height="68" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="136" y="368" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">测试线程</text>
  <text x="136" y="386" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">waitFor* 与断言</text>
  <text x="136" y="402" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">动作发起与等待</text>
  <rect x="243" y="348" width="193" height="68" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="339" y="368" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">Playwright 派发线程</text>
  <text x="339" y="386" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">onXxx 回调在此执行</text>
  <text x="339" y="402" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">禁重活 · 禁等待其他事件</text>
  <rect x="446" y="348" width="193" height="68" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="542" y="368" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">异步消费线程</text>
  <text x="542" y="386" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">有界队列 + 自有线程池</text>
  <text x="542" y="402" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">body 解析在队列外完成</text>
  <line x1="437" y1="382" x2="444" y2="382" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

name: Doc Drift Check

# T4-4：README 技术栈版本必须与根 pom <properties> 一致。
# CT2-23 扩展：本门禁同时校验 ① pom/README 引用的 docs/**/*.md 是否真实存在（悬空引用即失败）、
#             ② 根 pom 每个 <module> 是否能解析到含 pom.xml 的目录。
# 触发路径已纳入 docs/**（文档重命名/移动本身即应触发校验，原先文档改动根本不触发 → 无法抓 CT2-22 类问题）。
on:
  push:
    paths:
      - 'pom.xml'
      - 'README.md'
      - 'docs/**'
      - 'tools/check-doc-drift.sh'
      - 'tools/check-doc-drift.ps1'
      - 'tools/check_doc_standard.py'
      - '.github/workflows/doc-drift-check.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'README.md'
      - 'docs/**'
      - 'tools/check-doc-drift.sh'
      - 'tools/check-doc-drift.ps1'
      - 'tools/check_doc_standard.py'
      - '.github/workflows/doc-drift-check.yml'

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README versions match pom
        shell: pwsh
        run: pwsh tools/check-doc-drift.ps1
      # S4 quality gates: metadata / structure / link integrity of docs/**.
      # The script itself is in paths() on purpose: a broken checker must be
      # able to trigger the check, otherwise rule regressions go unnoticed.
      - name: Verify docs metadata and structure
        run: python3 tools/check_doc_standard.py --strict

# ============================================================================
# 框架配置文件（RouteDSL 监控 + API Monitor 数据库写库）—— 示例：本机 MySQL
# ----------------------------------------------------------------------------
# 解析优先级（ConfigReader）：系统属性 > 环境变量 > 本文件(Serenity 配置源) > 代码默认值。
# 本文件由测试期 ConfigResolver SPI（TestFrameworkConfigResolver）读取，语义等价于框架
# web 模块的 FrameworkConfigResolver（真实环境经 Serenity 合并配置源读取）。
# 写库相关配置一律写在这里，用例代码不再 setProperty。
# ============================================================================

# 开启 API Monitor 数据库写库
monitor.db.store.enabled=true
# 数据库类型（留空则按 monitor.db.url 自动探测）
monitor.db.type=MYSQL
# 数据库连接
monitor.db.url=jdbc:mysql://localhost:3306/route_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
monitor.db.user=root
monitor.db.password=root
# 连接池最大连接数
monitor.db.pool.max.size=2

# 本次测试运行 ID（标记本文件驱动写入的监控记录）
monitor.test.run.id=browser-e2e-run

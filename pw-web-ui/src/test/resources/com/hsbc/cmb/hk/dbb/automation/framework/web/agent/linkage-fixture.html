<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Linkage Fixture</title>
</head>
<body>
  <h1>Account Opening</h1>

  <!-- 联动 1：勾选同意 → 启用"理由"输入框（ENABLE 联动） -->
  <label>
    <input type="checkbox" id="agree" aria-label="I agree to the terms" />
    I agree to the terms
  </label>
  <input id="reason" aria-label="Reason" disabled placeholder="Reason (enabled after agree)" />

  <!-- 联动 2：账户类型选"对公" → "用途"字段出现（APPEAR 联动） -->
  <select id="accountType" aria-label="Account type">
    <option value="personal">Personal</option>
    <option value="corporate">Corporate</option>
  </select>
  <input id="purpose" aria-label="Purpose" style="display:none" placeholder="Purpose (required for corporate)" />

  <script>
    document.getElementById('agree').addEventListener('change', function (e) {
      document.getElementById('reason').disabled = !e.target.checked;
    });
    document.getElementById('accountType').addEventListener('change', function (e) {
      document.getElementById('purpose').style.display =
        (e.target.value === 'corporate') ? 'inline-block' : 'none';
    });
  </script>
</body>
</html>
